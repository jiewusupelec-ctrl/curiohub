name: Daily kids news update and GitHub Pages deploy

on:
  schedule:
    - cron: '30 22 * * *'
    - cron: '30 8 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Edge TTS
        run: python -m pip install --upgrade edge-tts

      - name: Refresh stories and render both voices
        run: python update_daily_stories.py

      - name: Commit refreshed static assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories-v2.json audio-manifest.json session-meta.json audio/ .nojekyll
          if git diff --cached --quiet; then
            echo "No story or audio changes to commit."
          else
            git commit -m "chore: refresh kids news audio [skip ci]"
            git push origin main
            git push origin main:gh-pages --force
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out generated site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html index-v2.html styles-v2.css app-v2.js stories-v2.json audio-manifest.json session-meta.json .nojekyll _site/
          cp -R audio _site/audio

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
